<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="100%" stop-color="#ECE3D3" />
    </linearGradient>

    <style>
      /* Animação suave e fluida das barras de frequência de áudio */
      @keyframes eqPulse1 {
        0%, 100% { transform: scaleY(0.4); }
        50% { transform: scaleY(1.15); }
      }
      @keyframes eqPulse2 {
        0%, 100% { transform: scaleY(0.9); }
        50% { transform: scaleY(0.35); }
      }
      @keyframes eqPulse3 {
        0%, 100% { transform: scaleY(0.5); }
        50% { transform: scaleY(1.3); }
      }

      .wave-bar {
        transform-origin: bottom;
      }
      .wb-1 { animation: eqPulse1 2.4s ease-in-out infinite; }
      .wb-2 { animation: eqPulse2 2.8s ease-in-out infinite; }
      .wb-3 { animation: eqPulse3 3.1s ease-in-out infinite; }
      .wb-4 { animation: eqPulse1 3.5s ease-in-out infinite reverse; }
    </style>
  </defs>
  <rect width="800" height="500" fill="url(#pGrad)" />
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#D8C8AD" stroke-width="1" />
  
  <!-- Browser Chrome / Frame -->
  <rect x="40" y="40" width="720" height="420" rx="8" fill="#FFFFFF" stroke="#E2DACD" />
  <line x1="40" y1="80" x2="760" y2="80" stroke="#EFE9DE" />
  
  <!-- Dots -->
  <circle cx="65" cy="60" r="4" fill="#D8C8AD" />
  <circle cx="80" cy="60" r="4" fill="#D8C8AD" />
  <circle cx="95" cy="60" r="4" fill="#D8C8AD" />
  <text x="400" y="64" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#888">aura-piano.web.app</text>

  <!-- Audio Waveform in Center (Animated Sound Equalizer Waves) -->
  <g transform="translate(100, 160)">
    <line x1="0" y1="40" x2="600" y2="40" stroke="#E8E0D2" stroke-width="1" />
    
    <rect class="wave-bar wb-1" x="50" y="25" width="4" height="30" rx="2" fill="#D8C8AD" />
    <rect class="wave-bar wb-2" x="70" y="15" width="4" height="50" rx="2" fill="#171717" />
    <rect class="wave-bar wb-3" x="90" y="5" width="4" height="70" rx="2" fill="#171717" />
    <rect class="wave-bar wb-4" x="110" y="20" width="4" height="40" rx="2" fill="#D8C8AD" />
    <rect class="wave-bar wb-1" x="130" y="30" width="4" height="20" rx="2" fill="#D8C8AD" />
    <rect class="wave-bar wb-2" x="150" y="10" width="4" height="60" rx="2" fill="#171717" />
    <rect class="wave-bar wb-3" x="170" y="0" width="4" height="80" rx="2" fill="#171717" />
    <rect class="wave-bar wb-4" x="190" y="18" width="4" height="44" rx="2" fill="#D8C8AD" />
    <rect class="wave-bar wb-1" x="210" y="28" width="4" height="24" rx="2" fill="#D8C8AD" />
    <rect class="wave-bar wb-2" x="230" y="12" width="4" height="56" rx="2" fill="#171717" />
    <rect class="wave-bar wb-3" x="250" y="2" width="4" height="76" rx="2" fill="#171717" />
    <rect class="wave-bar wb-4" x="270" y="15" width="4" height="50" rx="2" fill="#D8C8AD" />
    <rect class="wave-bar wb-1" x="290" y="32" width="4" height="16" rx="2" fill="#D8C8AD" />
    <rect class="wave-bar wb-2" x="310" y="8" width="4" height="64" rx="2" fill="#171717" />
    <rect class="wave-bar wb-3" x="330" y="22" width="4" height="36" rx="2" fill="#D8C8AD" />
    <rect class="wave-bar wb-4" x="350" y="14" width="4" height="52" rx="2" fill="#171717" />
    <rect class="wave-bar wb-1" x="370" y="0" width="4" height="80" rx="2" fill="#171717" />
    <rect class="wave-bar wb-2" x="390" y="25" width="4" height="30" rx="2" fill="#D8C8AD" />
    <rect class="wave-bar wb-3" x="410" y="10" width="4" height="60" rx="2" fill="#171717" />
    <rect class="wave-bar wb-4" x="430" y="30" width="4" height="20" rx="2" fill="#D8C8AD" />
    <rect class="wave-bar wb-1" x="450" y="18" width="4" height="44" rx="2" fill="#171717" />
    <rect class="wave-bar wb-2" x="470" y="8" width="4" height="64" rx="2" fill="#171717" />
    <rect class="wave-bar wb-3" x="490" y="28" width="4" height="24" rx="2" fill="#D8C8AD" />
    <rect class="wave-bar wb-4" x="510" y="16" width="4" height="48" rx="2" fill="#171717" />
  </g>

  <!-- Interactive Keys at bottom -->
  <g transform="translate(180, 290)">
    <rect x="0" y="0" width="30" height="130" rx="3" fill="#FFFFFF" stroke="#CCC" />
    <rect x="32" y="0" width="30" height="130" rx="3" fill="#FFFFFF" stroke="#CCC" />
    <rect x="64" y="0" width="30" height="130" rx="3" fill="#FBF7EE" stroke="#D8C8AD" />
    <rect x="96" y="0" width="30" height="130" rx="3" fill="#FFFFFF" stroke="#CCC" />
    <rect x="128" y="0" width="30" height="130" rx="3" fill="#FFFFFF" stroke="#CCC" />
    <rect x="160" y="0" width="30" height="130" rx="3" fill="#FFFFFF" stroke="#CCC" />
    <rect x="192" y="0" width="30" height="130" rx="3" fill="#FFFFFF" stroke="#CCC" />
    <rect x="224" y="0" width="30" height="130" rx="3" fill="#FFFFFF" stroke="#CCC" />
    <rect x="256" y="0" width="30" height="130" rx="3" fill="#FFFFFF" stroke="#CCC" />
    <rect x="288" y="0" width="30" height="130" rx="3" fill="#FFFFFF" stroke="#CCC" />
    <rect x="320" y="0" width="30" height="130" rx="3" fill="#FFFFFF" stroke="#CCC" />
    <rect x="352" y="0" width="30" height="130" rx="3" fill="#FFFFFF" stroke="#CCC" />
    <rect x="384" y="0" width="30" height="130" rx="3" fill="#FFFFFF" stroke="#CCC" />
    <rect x="416" y="0" width="30" height="130" rx="3" fill="#FFFFFF" stroke="#CCC" />

    <!-- Black keys -->
    <rect x="20" y="0" width="20" height="80" rx="2" fill="#171717" />
    <rect x="52" y="0" width="20" height="80" rx="2" fill="#171717" />
    <rect x="116" y="0" width="20" height="80" rx="2" fill="#171717" />
    <rect x="148" y="0" width="20" height="80" rx="2" fill="#171717" />
    <rect x="180" y="0" width="20" height="80" rx="2" fill="#171717" />
    <rect x="244" y="0" width="20" height="80" rx="2" fill="#171717" />
    <rect x="276" y="0" width="20" height="80" rx="2" fill="#171717" />
    <rect x="340" y="0" width="20" height="80" rx="2" fill="#171717" />
    <rect x="372" y="0" width="20" height="80" rx="2" fill="#171717" />
    <rect x="404" y="0" width="20" height="80" rx="2" fill="#171717" />
  </g>
</svg>