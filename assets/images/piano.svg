<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <linearGradient id="pianoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="100%" stop-color="#EFE8DB" />
    </linearGradient>
    <linearGradient id="goldKey" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2D4BC" />
      <stop offset="100%" stop-color="#C7B493" />
    </linearGradient>
    <filter id="pianoShadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#171717" flood-opacity="0.12" />
    </filter>

    <style>
      /* Animações musicais suaves e harmônicas */
      @keyframes waveHarmonic1 {
        0%, 100% {
          transform: translateY(0);
          opacity: 0.6;
        }
        50% {
          transform: translateY(-8px);
          opacity: 0.85;
        }
      }

      @keyframes waveHarmonic2 {
        0%, 100% {
          transform: translateY(0);
          opacity: 0.35;
        }
        50% {
          transform: translateY(7px);
          opacity: 0.6;
        }
      }

      @keyframes waveHarmonic3 {
        0%, 100% {
          transform: translateY(0);
          opacity: 0.25;
        }
        50% {
          transform: translateY(-5px);
          opacity: 0.45;
        }
      }

      @keyframes keyPressPulse {
        0%, 100% {
          opacity: 0.25;
          transform: scaleY(1);
        }
        50% {
          opacity: 0.65;
          transform: scaleY(0.97);
        }
      }

      @keyframes noteGentleFloat {
        0%, 100% {
          transform: translateY(0) rotate(0deg);
        }
        50% {
          transform: translateY(-6px) rotate(6deg);
        }
      }

      .animated-wave-1 {
        animation: waveHarmonic1 5s ease-in-out infinite;
      }
      .animated-wave-2 {
        animation: waveHarmonic2 6.5s ease-in-out infinite;
      }
      .animated-wave-3 {
        animation: waveHarmonic3 4.2s ease-in-out infinite;
      }

      .animated-key-highlight {
        transform-origin: top center;
        animation: keyPressPulse 3.5s ease-in-out infinite;
      }

      .animated-note-badge {
        transform-origin: 810px 115px;
        animation: noteGentleFloat 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <rect width="900" height="600" fill="url(#pianoBg)" />
  <rect x="24" y="24" width="852" height="552" fill="none" stroke="#D8C8AD" stroke-width="1" stroke-dasharray="4 4" opacity="0.7" />

  <!-- Harmonic sound waves in beige (Animated floating harmonics) -->
  <g class="animated-wave-1">
    <path d="M 50 180 Q 250 80, 450 180 T 850 180" fill="none" stroke="#D8C8AD" stroke-width="1.8" />
  </g>
  <g class="animated-wave-2">
    <path d="M 50 210 Q 250 110, 450 210 T 850 210" fill="none" stroke="#CBB99B" stroke-width="1.2" />
  </g>
  <g class="animated-wave-3">
    <path d="M 50 150 Q 250 50, 450 150 T 850 150" fill="none" stroke="#D8C8AD" stroke-width="1" stroke-dasharray="3 3" />
  </g>

  <!-- Piano Keyboard Bed -->
  <g transform="translate(110, 240)" filter="url(#pianoShadow)">
    <!-- Base Board -->
    <rect x="-10" y="-15" width="700" height="250" rx="10" fill="#171717" />
    <!-- Gold accent line on fallboard -->
    <line x1="20" y1="-5" x2="660" y2="-5" stroke="#D8C8AD" stroke-width="2" />
    
    <!-- White Keys (14 keys) -->
    <g transform="translate(18, 10)">
      <rect x="0" y="0" width="44" height="210" rx="3" fill="#FFFFFF" stroke="#E5DFD5" />
      <rect x="46" y="0" width="44" height="210" rx="3" fill="#FFFFFF" stroke="#E5DFD5" />
      <rect x="92" y="0" width="44" height="210" rx="3" fill="#FFFFFF" stroke="#E5DFD5" />
      <rect x="138" y="0" width="44" height="210" rx="3" fill="#FDFBF7" stroke="#E5DFD5" />
      <rect x="184" y="0" width="44" height="210" rx="3" fill="#FFFFFF" stroke="#E5DFD5" />
      <rect x="230" y="0" width="44" height="210" rx="3" fill="#FFFFFF" stroke="#E5DFD5" />
      <rect x="276" y="0" width="44" height="210" rx="3" fill="#FFFFFF" stroke="#E5DFD5" />
      <rect x="322" y="0" width="44" height="210" rx="3" fill="#FFFFFF" stroke="#E5DFD5" />
      <rect x="368" y="0" width="44" height="210" rx="3" fill="#FFFFFF" stroke="#E5DFD5" />
      <rect x="414" y="0" width="44" height="210" rx="3" fill="#FDFBF7" stroke="#E5DFD5" />
      <rect x="460" y="0" width="44" height="210" rx="3" fill="#FFFFFF" stroke="#E5DFD5" />
      <rect x="506" y="0" width="44" height="210" rx="3" fill="#FFFFFF" stroke="#E5DFD5" />
      <rect x="552" y="0" width="44" height="210" rx="3" fill="#FFFFFF" stroke="#E5DFD5" />
      <rect x="598" y="0" width="44" height="210" rx="3" fill="#FFFFFF" stroke="#E5DFD5" />

      <!-- Black Keys (10 keys) -->
      <rect x="30" y="0" width="28" height="135" rx="2" fill="#171717" />
      <rect x="76" y="0" width="28" height="135" rx="2" fill="#171717" />

      <rect x="168" y="0" width="28" height="135" rx="2" fill="#171717" />
      <rect x="214" y="0" width="28" height="135" rx="2" fill="#171717" />
      <rect x="260" y="0" width="28" height="135" rx="2" fill="#171717" />

      <rect x="352" y="0" width="28" height="135" rx="2" fill="#171717" />
      <rect x="398" y="0" width="28" height="135" rx="2" fill="#171717" />

      <rect x="490" y="0" width="28" height="135" rx="2" fill="#171717" />
      <rect x="536" y="0" width="28" height="135" rx="2" fill="#171717" />
      <rect x="582" y="0" width="28" height="135" rx="2" fill="#171717" />

      <!-- Key highlight with soothing pulse -->
      <rect class="animated-key-highlight" x="230" y="130" width="44" height="80" rx="2" fill="url(#goldKey)" />
    </g>
  </g>

  <!-- Title & Subtle Badge in Editorial Style -->
  <text x="110" y="110" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="600" fill="#171717">Harmonia &amp; Expressão</text>
  <text x="110" y="140" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="500" fill="#756F64" letter-spacing="3">O PIANO COMO REFÚGIO MUSICAL E CRIATIVO</text>

  <!-- Floating Note Badge -->
  <g class="animated-note-badge">
    <circle cx="810" cy="115" r="18" fill="#D8C8AD" opacity="0.6" />
    <circle cx="810" cy="115" r="14" fill="#FFFFFF" opacity="0.9" />
    <text x="810" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#171717">♩</text>
  </g>
</svg>