<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="poGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF7" />
      <stop offset="100%" stop-color="#EEE6D8" />
    </linearGradient>

    <style>
      @keyframes lineGrow {
        0%, 100% { transform: scaleX(0.7); }
        50% { transform: scaleX(1); }
      }

      @keyframes circlePulse {
        0%, 100% { transform: scale(1); opacity: 0.35; }
        50% { transform: scale(1.15); opacity: 0.6; }
      }

      .animated-rule {
        transform-origin: left;
        animation: lineGrow 4s ease-in-out infinite;
      }

      .animated-circ {
        transform-origin: 135px 110px;
        animation: circlePulse 5s ease-in-out infinite;
      }
    </style>
  </defs>
  <rect width="800" height="500" fill="url(#poGrad)" />
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#D8C8AD" stroke-width="1" />
  
  <rect x="40" y="40" width="720" height="420" rx="8" fill="#FFFFFF" stroke="#E2DACD" />
  <line x1="40" y1="80" x2="760" y2="80" stroke="#EFE9DE" />
  
  <circle cx="65" cy="60" r="4" fill="#D8C8AD" />
  <circle cx="80" cy="60" r="4" fill="#D8C8AD" />
  <circle cx="95" cy="60" r="4" fill="#D8C8AD" />
  <text x="400" y="64" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#888">editorial-craft.design</text>

  <!-- Editorial Layout Preview -->
  <g transform="translate(80, 110)">
    <text x="0" y="40" font-family="'Playfair Display', serif" font-size="36" font-style="italic" fill="#171717">Simplicity is clarity.</text>
    <line class="animated-rule" x1="0" y1="58" x2="200" y2="58" stroke="#D8C8AD" stroke-width="2.5" />
    
    <rect x="0" y="80" width="300" height="10" rx="3" fill="#E8DEC9" />
    <rect x="0" y="100" width="280" height="10" rx="3" fill="#E8DEC9" />
    <rect x="0" y="120" width="310" height="10" rx="3" fill="#E8DEC9" />
    <rect x="0" y="140" width="220" height="10" rx="3" fill="#E8DEC9" />

    <!-- Editorial side picture frame (Animated) -->
    <g transform="translate(360, 10)">
      <rect x="0" y="0" width="270" height="260" rx="4" fill="#F8F4EC" stroke="#D8C8AD" stroke-dasharray="3 3" />
      <circle class="animated-circ" cx="135" cy="110" r="45" fill="#D8C8AD" />
      <text x="135" y="190" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" letter-spacing="2" fill="#756F64">MINIMAL ARCHITECTURE</text>
    </g>

    <g transform="translate(0, 200)">
      <rect width="140" height="38" rx="19" fill="#171717" />
      <text x="70" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">Explorar Obra</text>
    </g>
  </g>
</svg>