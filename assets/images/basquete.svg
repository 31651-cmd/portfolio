<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <linearGradient id="bbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF7" />
      <stop offset="100%" stop-color="#EFE6D6" />
    </linearGradient>
    <linearGradient id="ballGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2D0B5" />
      <stop offset="100%" stop-color="#C2AD8D" />
    </linearGradient>

    <style>
      /* Animações esportivas suaves */
      @keyframes ballFloating {
        0%, 100% {
          transform: translateY(0) rotate(0deg);
        }
        50% {
          transform: translateY(-14px) rotate(5deg);
        }
      }

      @keyframes ballShadowPuff {
        0%, 100% {
          transform: scale(1);
          opacity: 0.25;
        }
        50% {
          transform: scale(0.82);
          opacity: 0.12;
        }
      }

      @keyframes netBreeze {
        0%, 100% {
          transform: rotate(0deg);
        }
        50% {
          transform: rotate(2deg);
        }
      }

      .animated-basketball {
        animation: ballFloating 3.6s ease-in-out infinite;
      }

      .animated-ball-shadow {
        transform-origin: 620px 335px;
        animation: ballShadowPuff 3.6s ease-in-out infinite;
      }

      .animated-net {
        transform-origin: 0 100px;
        animation: netBreeze 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <rect width="900" height="600" fill="url(#bbBg)" />
  <rect x="24" y="24" width="852" height="552" fill="none" stroke="#D8C8AD" stroke-width="1" stroke-dasharray="4 4" opacity="0.7" />

  <!-- Abstract Court Arc & Key Lines -->
  <path d="M 120 540 C 260 380, 640 380, 780 540" fill="none" stroke="#D8C8AD" stroke-width="2" />
  <circle cx="450" cy="460" r="80" fill="none" stroke="#D8C8AD" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="450" y1="460" x2="450" y2="550" stroke="#171717" stroke-width="1" opacity="0.3" />

  <!-- Minimalist Backboard & Hoop Architecture -->
  <g transform="translate(450, 180)">
    <!-- Backboard -->
    <rect x="-140" y="-70" width="280" height="180" rx="6" fill="#FFFFFF" stroke="#171717" stroke-width="2" />
    <!-- Inner Target Box -->
    <rect x="-50" y="20" width="100" height="75" fill="none" stroke="#D8C8AD" stroke-width="3" />
    
    <!-- Rim Mounting Bracket -->
    <rect x="-12" y="88" width="24" height="12" fill="#171717" />
    <!-- Rim -->
    <path d="M -45 98 C -45 92, 45 92, 45 98 C 45 116, -45 116, -45 98 Z" fill="none" stroke="#171717" stroke-width="4" />
    
    <!-- Net Lines (Animated Gentle Breeze) -->
    <g class="animated-net">
      <path d="M -40 102 L -28 170 L -12 104 L 0 170 L 12 104 L 28 170 L 40 102" fill="none" stroke="#D8C8AD" stroke-width="1.8" />
      <path d="M -28 170 C -15 178, 15 178, 28 170" fill="none" stroke="#D8C8AD" stroke-width="1.8" />
    </g>
  </g>

  <!-- Sombra suave projetada abaixo da bola -->
  <ellipse class="animated-ball-shadow" cx="620" cy="335" rx="38" ry="8" fill="#171717" />

  <!-- Clean Floating Minimal Basketball (Animated) -->
  <g class="animated-basketball" transform="translate(620, 260)">
    <circle cx="0" cy="0" r="54" fill="url(#ballGrad)" stroke="#171717" stroke-width="2" />
    <!-- Seams -->
    <line x1="-54" y1="0" x2="54" y2="0" stroke="#171717" stroke-width="1.8" />
    <line x1="0" y1="-54" x2="0" y2="54" stroke="#171717" stroke-width="1.8" />
    <path d="M -36 -40 C -10 -20, -10 20, -36 40" fill="none" stroke="#171717" stroke-width="1.6" />
    <path d="M 36 -40 C 10 -20, 10 20, 36 40" fill="none" stroke="#171717" stroke-width="1.6" />
  </g>

  <!-- Editorial Typography -->
  <text x="80" y="100" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="600" fill="#171717">Energia &amp; Coletivo</text>
  <text x="80" y="130" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="500" fill="#756F64" letter-spacing="3">BASQUETE, PRECISÃO E ESPÍRITO DE EQUIPE</text>
</svg>